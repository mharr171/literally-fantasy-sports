name: Release Please

# Keeps a "chore(main): release x.y.z" PR open that collects the changelog
# from Conventional Commit titles on main (D71). Merging that PR bumps the
# version, updates CHANGELOG.md, tags the release (v0.1.0, v0.2.0, …) and
# publishes a GitHub release. Merge it at the end of each milestone (D58).
#
# Uses RELEASE_PLEASE_TOKEN instead of the built-in token because pull
# requests opened by the built-in token don't trigger CI, and main requires
# green CI before merging.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
