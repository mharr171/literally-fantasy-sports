name: Keep-alive

# Free Supabase projects pause after a week without activity. A tiny query
# every day keeps lfs-prod and lfs-dev awake (roadmap: "Scheduled work").

on:
  schedule:
    - cron: "17 13 * * *" # daily, 13:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: Ping ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: lfs-prod
            secret: PROD_DATABASE_URL
          - project: lfs-dev
            secret: DEV_DATABASE_URL
    steps:
      - name: Run a trivial query
        env:
          DATABASE_URL: ${{ secrets[matrix.secret] }}
        run: |
          docker run --rm -e DATABASE_URL postgres:17 \
            sh -c 'psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -tAc "select count(*) from public.profiles"' \
            | sed 's/^/profiles: /'
