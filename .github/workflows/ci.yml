name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  database:
    name: Database migrations and security rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # Supabase runs Postgres 17.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check migrations match the schema
        run: |
          pnpm db:generate
          git diff --exit-code -- packages/db/migrations || {
            echo "::error::packages/db/src/schema.ts changed without a migration. Run 'pnpm db:generate' and commit the result."
            exit 1
          }
          test -z "$(git status --porcelain -- packages/db/migrations)" || {
            echo "::error::Uncommitted migration files were generated. Run 'pnpm db:generate' and commit the result."
            git status --porcelain -- packages/db/migrations
            exit 1
          }
      - name: Prepare a throwaway Supabase-like database
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/db/ci/supabase-stub.sql
      - name: Apply migrations
        run: pnpm --filter @lfs/db migrate
      - name: Apply migrations again (should do nothing)
        run: pnpm --filter @lfs/db migrate
      - name: Test row-level security
        run: pnpm test:db
