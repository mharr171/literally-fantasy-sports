name: Database migrations

# Applies committed migrations from packages/db/migrations after they reach
# main: first to lfs-dev, then to lfs-prod once Gary approves the
# "production" environment (D69).

on:
  push:
    branches: [main]
    paths:
      - packages/db/migrations/**
  workflow_dispatch:

concurrency:
  group: db-migrate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dev:
    name: Apply to lfs-dev
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lfs/db migrate
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}

  prod:
    name: Apply to lfs-prod
    needs: dev
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lfs/db migrate
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
